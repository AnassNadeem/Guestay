# Guestay Admin — static Vite/Refine SPA on Cloudflare Workers Assets
# Domain: admin.guestay.pk
#
# Build then deploy:
#   npm run build:admin
#   npm run deploy:admin
#
# Env for the SPA is baked in at Vite build time (VITE_*).

"$schema" = "../node_modules/wrangler/config-schema.json"
name = "guestay-admin"
compatibility_date = "2026-08-03"
workers_dev = true

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

[[routes]]
pattern = "admin.guestay.pk"
custom_domain = true
